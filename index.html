<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Koli Jarvis</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #070b14;
    --card: rgba(255, 255, 255, 0.055);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #eef2ff;
    --soft: #cdd6f0;
    --muted: #93a0bd;
    --dim: #64748b;
    --accent: #5eead4;
    --accent-2: #818cf8;
    --ok: #4ade80;
    --info: #60a5fa;
    --warn: #fbbf24;
    --err: #f87171;
    --idle: #64748b;
    --radius: 1.3rem;
  }

  /* 1 rem = 16px 1280×800-on, 24px 1920×1200-on – minden arányosan skálázódik */
  html { font-size: min(1.25vw, 2vh); }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", "Roboto", "Noto Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  svg { display: block; }

  /* ---------- Lassan mozgó színes háttér ---------- */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .blob.b1 { width: 60vw; height: 60vw; left: -15vw; top: -25vw; background: radial-gradient(circle, rgba(30, 58, 138, 0.62), rgba(30, 58, 138, 0) 68%); animation: drift1 60s ease-in-out infinite alternate; }
  .blob.b2 { width: 50vw; height: 50vw; right: -15vw; bottom: -25vw; background: radial-gradient(circle, rgba(15, 118, 110, 0.58), rgba(15, 118, 110, 0) 68%); animation: drift2 75s ease-in-out infinite alternate; }
  .blob.b3 { width: 35vw; height: 35vw; left: 40vw; top: 30vh; background: radial-gradient(circle, rgba(91, 33, 182, 0.38), rgba(91, 33, 182, 0) 68%); animation: drift3 90s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(12vw, 10vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-10vw, -8vh) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-20vw, -15vh) scale(0.85); } }

  /* ---------- Elrendezés ---------- */
  #app {
    position: fixed; inset: 0; z-index: 1;
    padding: 0.8rem 1.4rem;
    display: grid;
    grid-template-columns: 31rem minmax(0, 1fr) 20rem;
    grid-template-rows: 13.6rem minmax(0, 1fr);
    gap: 1rem;
    transition: transform 8s ease-in-out;
  }
  .card {
    position: relative; min-height: 0; min-width: 0; overflow: hidden;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 0.9rem 1.1rem;
  }
  .label {
    font-size: 0.9rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .badge {
    display: none; flex: none; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.3rem 0.65rem; border-radius: 0.5rem; line-height: 1.1;
    background: rgba(251, 191, 36, 0.15); color: var(--warn); border: 1px solid rgba(251, 191, 36, 0.4);
  }
  body.sample .badge { display: inline-block; }

  /* ---------- Óra ---------- */
  .clock { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 0.3rem; min-width: 0; }
  .greet-row { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
  .greet { font-size: 1.9rem; font-weight: 600; line-height: 1.2; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .time {
    font-size: 9.1rem; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: -0.25rem;
    background: linear-gradient(180deg, #fff 30%, #b6c2e2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .time .sec {
    font-size: 0.32em; font-weight: 400; letter-spacing: 0; margin-left: 0.6rem;
    color: var(--muted); -webkit-text-fill-color: var(--muted);
  }
  .date { font-size: 1.85rem; color: var(--soft); margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date b { font-weight: 600; color: #fff; }

  /* ---------- Időjárás ---------- */
  .weather { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 0.45rem; }
  .card-head { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .wx-now { display: flex; align-items: center; gap: 0.8rem; min-height: 0; }
  .wx-icon { width: 4.4rem; height: 4.4rem; flex: none; }
  .wx-icon svg { width: 100%; height: 100%; }
  .temp { font-size: 4.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .temp small { font-size: 0.42em; font-weight: 400; color: var(--muted); vertical-align: 0.9em; margin-left: 0.15rem; }
  .cond { font-size: 1.15rem; color: var(--soft); line-height: 1.2; min-width: 0; }
  .cond .feels { display: block; font-size: 0.95rem; color: var(--muted); margin-top: 0.15rem; }
  .wx-meta { display: flex; gap: 1rem; font-size: 1.05rem; color: var(--muted); white-space: nowrap; }
  .wx-meta span { display: inline-flex; align-items: center; gap: 0.3rem; }
  .wx-meta svg { width: 1.1rem; height: 1.1rem; }
  .wx-meta b { color: var(--text); font-weight: 600; }
  .forecast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin-top: auto; }
  .fc { background: rgba(255, 255, 255, 0.04); border-radius: 0.7rem; padding: 0.3rem 0.4rem 0.35rem; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; min-width: 0; }
  .fc .row2 { display: flex; align-items: center; gap: 0.35rem; }
  .fc svg { width: 1.6rem; height: 1.6rem; flex: none; }
  .fc .d { font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .fc .t { font-size: 1rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fc .t span { color: var(--muted); font-weight: 400; }

  .ic-sun { color: #fcd34d; }
  .ic-moon { color: #c7d2fe; }
  .ic-cloud { color: #b9c7de; }
  .ic-rain { color: #60a5fa; }
  .ic-snow { color: #e0f2fe; }
  .ic-storm { color: #facc15; }
  .ic-fog { color: #9fb0c8; }

  /* ---------- Botok ---------- */
  .bots {
    grid-column: 1 / span 2; grid-row: 2; min-height: 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 0.7rem;
  }
  .bot { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.75rem 1rem; --s: var(--idle); }
  .bot[data-status="ok"] { --s: var(--ok); }
  .bot[data-status="info"] { --s: var(--info); }
  .bot[data-status="running"] { --s: var(--info); }
  .bot[data-status="warn"] { --s: var(--warn); }
  .bot[data-status="error"] { --s: var(--err); }
  .bot::after {
    content: ""; position: absolute; left: -3rem; top: -3rem; width: 9rem; height: 9rem; border-radius: 50%;
    background: radial-gradient(circle, var(--s), transparent 70%); opacity: 0.13; pointer-events: none;
  }
  .bot-head { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
  .bot-icon {
    width: 2.3rem; height: 2.3rem; flex: none; border-radius: 0.7rem; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.07); color: var(--accent); font-size: 1.4rem; line-height: 1;
  }
  .bot-icon svg { width: 1.4rem; height: 1.4rem; }
  .bot-title { min-width: 0; flex: 1; }
  .bot-name { font-size: 1.2rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot-name.long { font-size: 1.05rem; }
  .bot-sub { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.1rem; }
  .bot-line {
    font-size: 1.1rem; line-height: 1.22; color: #dbe3f7; flex-shrink: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bot-foot { margin-top: auto; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--dim); white-space: nowrap; min-width: 0; }
  .bot-foot .st { color: var(--s); font-weight: 700; }
  .bot-value {
    margin-left: auto; padding-left: 0.5rem; font-size: 1.5rem; font-weight: 800; line-height: 1; color: var(--text);
    font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
  }
  .dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--s); box-shadow: 0 0 0.6rem var(--s); flex: none; }
  .bot[data-status="running"] .dot, .bot[data-status="error"] .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }

  /* ---------- Jarvis – mai összefoglaló ---------- */
  .jarvis {
    grid-column: span 2; display: flex; flex-direction: column; gap: 0.45rem;
    background: linear-gradient(120deg, rgba(94, 234, 212, 0.11), rgba(129, 140, 248, 0.11));
    border-color: rgba(129, 140, 248, 0.3);
  }
  .orb { width: 2.3rem; height: 2.3rem; flex: none; border-radius: 50%; position: relative; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .orb::before {
    background: conic-gradient(from 0deg, var(--accent), transparent 40%, var(--accent-2), transparent 85%, var(--accent)); animation: spin 6s linear infinite;
    -webkit-mask: radial-gradient(circle, transparent 55%, #000 57%); mask: radial-gradient(circle, transparent 55%, #000 57%);
  }
  .orb::after { inset: 32%; background: var(--accent); box-shadow: 0 0 1rem var(--accent); animation: breathe 4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(0.7); opacity: 0.6; } }
  .j-title { font-size: 1.3rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .j-src { font-size: 0.95rem; color: var(--muted); white-space: nowrap; flex: none; display: flex; align-items: center; gap: 0.4rem; }
  .j-src.warn { color: var(--warn); }
  .src-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0.5rem currentColor; }
  .j-src.warn .src-dot { background: var(--warn); }
  .j-text {
    font-size: 1.45rem; line-height: 1.3; color: var(--text); flex-shrink: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- Teendők ---------- */
  .todos { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-direction: column; }
  .todos .card-head { margin-bottom: 0.3rem; }
  .todos h2 { margin: 0; font-size: 1.45rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { white-space: nowrap; flex: none; font-size: 0.9rem; font-weight: 700; color: var(--accent); background: rgba(94, 234, 212, 0.12); padding: 0.15rem 0.6rem; border-radius: 1rem; }
  .todo-list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; }
  .todo {
    display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.65rem 0.2rem 0.65rem 0.6rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06); position: relative;
  }
  .todo.high::before { content: ""; position: absolute; left: 0; top: 0.7rem; bottom: 0.7rem; width: 0.22rem; border-radius: 0.2rem; background: var(--warn); }
  .todo.next { background: linear-gradient(90deg, rgba(94, 234, 212, 0.13), transparent); border-radius: 0.6rem; }
  .chk { width: 1.5rem; height: 1.5rem; flex: none; margin-top: 0.1rem; border-radius: 50%; border: 2px solid var(--dim); display: grid; place-items: center; color: transparent; box-sizing: border-box; }
  .chk svg { width: 1rem; height: 1rem; }
  .todo.done .chk { border-color: var(--ok); background: var(--ok); color: #04140c; }
  .todo.reminder .chk { border: 0; color: var(--accent-2); }
  .todo.reminder .chk svg { width: 1.45rem; height: 1.45rem; }
  .todo-body { min-width: 0; flex: 1; }
  .todo-text { font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; }
  .todo.done .todo-text { color: var(--dim); text-decoration: line-through; }
  .todo-time { display: inline-block; font-size: 0.95rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 0.15rem; }
  .todo-time .tag { color: #04121c; background: var(--accent); border-radius: 0.35rem; padding: 0 0.35rem; margin-left: 0.35rem; font-size: 0.8rem; letter-spacing: 0.04em; }
  .todo.done .todo-time { color: var(--dim); }
  .todo-more { font-size: 1.05rem; color: var(--muted); padding: 0.6rem 0.6rem 0; }
  .empty { color: var(--muted); font-size: 1.2rem; padding: 1rem 0.6rem; }

  /* ---------- Éjszakai halványítás ---------- */
  #night { position: fixed; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; transition: opacity 30s ease; }
  body.night #night { opacity: 0.88; pointer-events: auto; }
  body.night .blob, body.night .orb::before, body.night .orb::after, body.night .dot { animation-play-state: paused; }

  /* Álló tájolás esetére egy egyszerű tartalék */
  @media (orientation: portrait) {
    html { font-size: min(2vw, 1.5vh); }
    #app { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto minmax(0, 1fr) auto; }
    .clock { grid-column: 1 / span 2; grid-row: 1; }
    .weather { grid-column: 1 / span 2; grid-row: 2; }
    .bots { grid-column: 1 / span 2; grid-row: 3; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .todos { grid-column: 1 / span 2; grid-row: 4; max-height: 30vh; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <main id="app">
    <section class="clock">
      <div class="greet-row"><div class="greet" id="greet">Szép napot</div><span class="badge">Példa adatok</span></div>
      <div class="time" id="time">--:--<span class="sec">--</span></div>
      <div class="date" id="date">&nbsp;</div>
    </section>

    <section class="card weather" id="weather"></section>

    <section class="bots" id="bots"></section>

    <section class="card todos">
      <div class="card-head">
        <h2 class="grow">Mai teendők</h2>
        <span class="count" id="todoCount">0</span>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </section>
  </main>

  <div id="night" title="Koppints a felébresztéshez"></div>

    rain: '<g transform="translate(0 -3)"><path d="' + CLOUD + '"/></g><path d="M8.5 18.5l-1 2.5M12.5 18.5l-1 2.5M16.5 18.5l-1 2.5"/>',

  load();
  (function scheduleShift() {
    setTimeout(function () { shift(); scheduleShift(); }, Math.max(1, num(settings().shiftMinutes) || 3) * 60000);
  })();
})();
</script>
